[package]
name = "icedxdy_widget"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
canvas = ["iced_widget/canvas"]
crisp = []
highlighter = [
    "dep:log",
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-rust",
]
markdown = ["dep:pulldown-cmark", "highlighter"]
spinner = ["canvas", "dep:lyon_algorithms"]

[dependencies]
icedxdy_core.workspace = true
iced_core.workspace = true
iced_runtime = { workspace = true, features = ["selector"] }
iced_widget.workspace = true
log = { workspace = true, optional = true }
lyon_algorithms = { version = "1.0", optional = true }
num-traits = "0.2"
pulldown-cmark = { workspace = true, optional = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-highlight = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
