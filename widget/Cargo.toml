[package]
name = "icedxdy_widget"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
canvas = ["iced_widget/canvas"]
crisp = []
highlighter = [
    "dep:log",
    "dep:serde",
    "dep:serde_json",
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-rust",
]
markdown = ["dep:pulldown-cmark", "highlighter"]
spinner = ["canvas", "dep:lyon_algorithms"]
svg = ["iced_widget/svg", "icedxdy_core/svg"]
sweeten = ["dep:sweeten", "icedxdy_core/sweeten"]

[dependencies]
icedxdy_core.workspace = true
iced_core.workspace = true
iced_runtime = { workspace = true, features = ["selector"] }
iced_widget = { workspace = true, features = ["image"] }
log = { workspace = true, optional = true }
lyon_algorithms = { version = "1.0", optional = true }
num-traits = "0.2"
pulldown-cmark = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sweeten = { workspace = true, optional = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-highlight = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
unicode-segmentation = "1.11.0"

[dev-dependencies]
iced_test.workspace = true
