[package]
name = "icedxdy"
description = "A shadcn-inspired component library for Iced"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = []
markdown = ["icedxdy_core/markdown", "icedxdy_widget/markdown"]
spinner = ["icedxdy_widget/spinner"]
sweeten = ["icedxdy_core/sweeten"]

[dependencies]
icedxdy_core.workspace = true
icedxdy_widget.workspace = true
iced.workspace = true
iced_core.workspace = true
iced_widget.workspace = true

[workspace]
members = [
  "core",
  "widget",
  "examples/browser",
  "examples/highlight",
]

[workspace.package]
version = "0.1.0"
authors = ["Andy Gayton <andy@thecollective.dev>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/airstrike/icedxdy"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "interface", "widgets", "shadcn"]
rust-version = "1.85"

[workspace.dependencies]
icedxdy = { path = "." }
icedxdy_core = { path = "./core" }
icedxdy_widget = { path = "./widget" }

iced = "0.15.0-dev"
iced_core = "0.15.0-dev"
iced_runtime = "0.15.0-dev"
iced_selector = "0.15.0-dev"
iced_widget = "0.15.0-dev"
# Sweeten ships an enhanced data-grid `Table` (border, sticky header,
# header underline) on its `dev` branch. Once `dev` merges to `master`
# upstream, drop the `branch` qualifier.
sweeten = { git = "https://github.com/airstrike/sweeten.git", branch = "dev" }
log = "0.4"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"

[patch.crates-io]
iced.git = "https://github.com/airstrike/iced.git"
iced.branch = "dev"
iced_core.git = "https://github.com/airstrike/iced.git"
iced_core.branch = "dev"
iced_runtime.git = "https://github.com/airstrike/iced.git"
iced_runtime.branch = "dev"
iced_selector.git = "https://github.com/airstrike/iced.git"
iced_selector.branch = "dev"
iced_widget.git = "https://github.com/airstrike/iced.git"
iced_widget.branch = "dev"
cosmic-text = { git = "https://github.com/airstrike/cosmic-text", branch = "dev" }
