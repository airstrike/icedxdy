cargo-features = ["cascade-dylib"]

[package]
name = "icedxdy"
description = "A shadcn-inspired component library for Iced"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = []
markdown = ["icedxdy_core/markdown", "icedxdy_widget/markdown"]
spinner = ["icedxdy_widget/spinner"]
svg = ["icedxdy_core/svg"]
sweeten = ["icedxdy_widget/sweeten"]

[dependencies]
icedxdy_core.workspace = true
icedxdy_widget.workspace = true
iced.workspace = true
iced_core.workspace = true
iced_widget.workspace = true

[workspace]
members = [
  "core",
  "widget",
  "examples/browser",
  "examples/highlight",
]

[workspace.package]
version = "0.1.0"
authors = ["Andy Gayton <andy@thecollective.dev>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/airstrike/icedxdy"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "interface", "widgets", "shadcn"]
rust-version = "1.85"

[workspace.dependencies]
icedxdy = { path = "." }
icedxdy_core = { path = "./core" }
icedxdy_widget = { path = "./widget" }

iced = "0.15.0-dev"
iced_core = "0.15.0-dev"
iced_runtime = "0.15.0-dev"
iced_selector = "0.15.0-dev"
iced_widget = "0.15.0-dev"
# Sweeten ships an enhanced data-grid `Table` (border, sticky header,
# header underline) on its `dev` branch. Once `dev` merges to `master`
# upstream, drop the `branch` qualifier.
sweeten = { git = "https://github.com/airstrike/sweeten.git", branch = "dev" }
log = "0.4"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"

[profile.dev]
rpath = true

# Opt OUT of the cascade-dylib promotion — tree-sitter ships C source built
# by its build.rs (`cc` archive of `ts_*` symbols). When the cascade
# promotes tree-sitter to dylib, the C archive doesn't make it across the
# dylib boundary and tree-sitter-highlight fails to link
# (`Undefined symbol: _ts_query_cursor_next_capture`). Forcing rlib keeps
# the C objects bundled the way the build script expects.
[profile.dev.package.tree-sitter]
crate-type = ["lib"]

[profile.dev.package.tree-sitter-highlight]
crate-type = ["lib"]

[profile.dev.package.tree-sitter-language]
crate-type = ["lib"]

[profile.dev.package.tree-sitter-rust]
crate-type = ["lib"]

[patch.crates-io]
iced = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_core = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_runtime = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_selector = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_widget = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_graphics = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_renderer = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_program = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_winit = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_wgpu = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_tiny_skia = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_futures = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_debug = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_highlighter = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
cosmic-text = { git = "https://github.com/airstrike/cosmic-text", branch = "dev" }
