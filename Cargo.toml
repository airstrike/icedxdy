cargo-features = ["profile-crate-type"]

[package]
name = "icedxdy"
description = "A shadcn-inspired component library for Iced"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = []
markdown = ["icedxdy_core/markdown", "icedxdy_widget/markdown"]
spinner = ["icedxdy_widget/spinner"]
svg = ["icedxdy_core/svg"]
sweeten = ["icedxdy_widget/sweeten"]

[dependencies]
icedxdy_core.workspace = true
icedxdy_widget.workspace = true
iced.workspace = true
iced_core.workspace = true
iced_widget.workspace = true

[workspace]
members = [
  "core",
  "widget",
  "examples/browser",
  "examples/highlight",
]

[workspace.package]
version = "0.1.0"
authors = ["Andy Gayton <andy@thecollective.dev>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/airstrike/icedxdy"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "interface", "widgets", "shadcn"]
rust-version = "1.85"

[workspace.dependencies]
icedxdy = { path = "." }
icedxdy_core = { path = "./core" }
icedxdy_widget = { path = "./widget" }

iced = "0.15.0-dev"
iced_core = "0.15.0-dev"
iced_runtime = "0.15.0-dev"
iced_selector = "0.15.0-dev"
iced_widget = "0.15.0-dev"
# Sweeten ships an enhanced data-grid `Table` (border, sticky header,
# header underline) on its `dev` branch. Once `dev` merges to `master`
# upstream, drop the `branch` qualifier.
sweeten = { git = "https://github.com/airstrike/sweeten.git", branch = "dev" }
log = "0.4"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"

[profile.dev]
rpath = true

# Per-package crate-type overrides for granita hot-reload. Mirrors the
# pattern in ~/projects/granita/Cargo.toml — promote the iced subcrates
# granita's host dlopens (12-crate doctor allowlist, minus the three
# rlib-shy ones: iced_runtime / iced_winit / iced_tiny_skia) plus
# tracing-core (single Dispatch global), once_cell, and the no_std
# transitive rlibs (cfg-if, hashbrown, foldhash, equivalent) that would
# otherwise be statically embedded in multiple dylibs. Requires the
# unstable `profile-crate-type` cargo feature plus the std-shim from
# airstrike/cargo branch crate-type-override — use
# ~/projects/cargo/target/release/cargo on nightly.
[profile.dev.package.iced]
crate-type = ["lib", "dylib"]

[profile.dev.package.iced_core]
crate-type = ["lib", "dylib"]

[profile.dev.package.iced_widget]
crate-type = ["lib", "dylib"]

[profile.dev.package.iced_graphics]
crate-type = ["lib", "dylib"]

[profile.dev.package.iced_renderer]
crate-type = ["lib", "dylib"]

[profile.dev.package.iced_program]
crate-type = ["lib", "dylib"]

[profile.dev.package.iced_futures]
crate-type = ["lib", "dylib"]

[profile.dev.package.iced_wgpu]
crate-type = ["lib", "dylib"]

[profile.dev.package.iced_debug]
crate-type = ["lib", "dylib"]

[profile.dev.package.iced_highlighter]
crate-type = ["lib", "dylib"]

[profile.dev.package.tracing-core]
crate-type = ["lib", "dylib"]

[profile.dev.package.once_cell]
crate-type = ["lib", "dylib"]

[profile.dev.package.cfg-if]
crate-type = ["lib", "dylib"]

[profile.dev.package.hashbrown]
crate-type = ["lib", "dylib"]

[profile.dev.package.foldhash]
crate-type = ["lib", "dylib"]

[profile.dev.package.equivalent]
crate-type = ["lib", "dylib"]

[profile.dev.package.indexmap]
crate-type = ["lib", "dylib"]

[profile.dev.package.memchr]
crate-type = ["lib", "dylib"]

[profile.dev.package.bit-set]
crate-type = ["lib", "dylib"]

[profile.dev.package.bit-vec]
crate-type = ["lib", "dylib"]

# Tokio uses thread-local storage to track its runtime context.
# Without dylib promotion, each dylib (iced, granita, browser via fount)
# would statically link its own tokio with its own TLS — iced enters
# its tokio context, browser.dylib's tokio::fs queries its OWN tokio's
# TLS and finds nothing, panics in spawn_blocking.
[profile.dev.package.tokio]
crate-type = ["lib", "dylib"]

[profile.dev.package.bytes]
crate-type = ["lib", "dylib"]

# resvg pulls these in transitively when iced/svg is enabled. Without
# dylib promotion they collide with the rest of the dylib graph in test
# mode ("cannot satisfy dependencies so X only shows up once").
[profile.dev.package.resvg]
crate-type = ["lib", "dylib"]

[profile.dev.package.flate2]
crate-type = ["lib", "dylib"]

[profile.dev.package.crc32fast]
crate-type = ["lib", "dylib"]

[profile.dev.package.miniz_oxide]
crate-type = ["lib", "dylib"]

[profile.dev.package.simd_adler32]
crate-type = ["lib", "dylib"]

[profile.dev.package.base64]
crate-type = ["lib", "dylib"]

# resvg/usvg/fontdb-driven text-shaping transitives that also collide
# under the dylib graph once iced/svg is enabled.
[profile.dev.package.fontdb]
crate-type = ["lib", "dylib"]

[profile.dev.package.ttf-parser]
crate-type = ["lib", "dylib"]

[profile.dev.package.memmap2]
crate-type = ["lib", "dylib"]

[profile.dev.package.slotmap]
crate-type = ["lib", "dylib"]

# Numeric / utility rlibs — all over the iced + resvg + cosmic-text graph;
# any one of them existing in both rlib-only and dylib-promoted form
# trips the "only shows up once" check.
[profile.dev.package.arrayvec]
crate-type = ["lib", "dylib"]

[profile.dev.package.bitflags]
crate-type = ["lib", "dylib"]

[profile.dev.package.bytemuck]
crate-type = ["lib", "dylib"]

[profile.dev.package.libc]
crate-type = ["lib", "dylib"]

[profile.dev.package.log]
crate-type = ["lib", "dylib"]

[profile.dev.package.smallvec]
crate-type = ["lib", "dylib"]

[profile.dev.package.tinyvec]
crate-type = ["lib", "dylib"]

[profile.dev.package.tinyvec_macros]
crate-type = ["lib", "dylib"]

[profile.dev.package.unicode-bidi]
crate-type = ["lib", "dylib"]

[profile.dev.package.unicode-script]
crate-type = ["lib", "dylib"]

[patch.crates-io]
iced.git = "https://github.com/airstrike/iced.git"
iced.branch = "dev"
iced_core.git = "https://github.com/airstrike/iced.git"
iced_core.branch = "dev"
iced_runtime.git = "https://github.com/airstrike/iced.git"
iced_runtime.branch = "dev"
iced_selector.git = "https://github.com/airstrike/iced.git"
iced_selector.branch = "dev"
iced_widget.git = "https://github.com/airstrike/iced.git"
iced_widget.branch = "dev"
iced_graphics.git = "https://github.com/airstrike/iced.git"
iced_graphics.branch = "dev"
iced_renderer.git = "https://github.com/airstrike/iced.git"
iced_renderer.branch = "dev"
iced_program.git = "https://github.com/airstrike/iced.git"
iced_program.branch = "dev"
iced_winit.git = "https://github.com/airstrike/iced.git"
iced_winit.branch = "dev"
iced_wgpu.git = "https://github.com/airstrike/iced.git"
iced_wgpu.branch = "dev"
iced_tiny_skia.git = "https://github.com/airstrike/iced.git"
iced_tiny_skia.branch = "dev"
iced_futures.git = "https://github.com/airstrike/iced.git"
iced_futures.branch = "dev"
iced_debug.git = "https://github.com/airstrike/iced.git"
iced_debug.branch = "dev"
iced_highlighter.git = "https://github.com/airstrike/iced.git"
iced_highlighter.branch = "dev"
